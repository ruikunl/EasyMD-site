name: Feature request
description: Suggest a new capability or workflow.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow should EasyMD improve?
      description: Tell us what you are trying to do.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the feature or interaction you want.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PDF export
        - Tables
        - Images
        - Feishu import/export
        - Formula support
        - Code block support
        - Other
